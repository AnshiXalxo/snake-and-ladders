<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snakes & Ladders</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <span class="win-crown">👑</span>
    <div class="win-title">WINNER!</div>
    <div class="win-sub" id="winSub">Player 1 Wins!</div>
    <button class="restart-btn" onclick="restart()">PLAY AGAIN</button>
  </div>
</div>

<div class="game-wrap">

  <!-- BOARD -->
  <div class="board-section">
    <div class="game-title">🐍 SNAKES &amp; LADDERS 🪜</div>

    <div class="board-outer">
      <div class="board-grid" id="grid"></div>
      <svg class="board-svg" id="svg" viewBox="0 0 560 560"></svg>
    </div>

    <div class="board-legend">
      <div class="leg">
        <div class="leg-dot" style="background:var(--ladder);box-shadow:0 0 6px var(--ladder)"></div>
        <span style="color:var(--ladder)">LADDER</span>
      </div>

      <div class="leg">
        <div class="leg-dot" style="background:var(--snake);box-shadow:0 0 6px var(--snake)"></div>
        <span style="color:var(--snake)">SNAKE</span>
      </div>

      <div class="leg">
        <div class="leg-dot" style="background:var(--p1);box-shadow:0 0 6px var(--p1)"></div>
        <span style="color:var(--p1)">P1</span>
      </div>

      <div class="leg">
        <div class="leg-dot" style="background:var(--p2);box-shadow:0 0 6px var(--p2)"></div>
        <span style="color:var(--p2)">P2</span>
      </div>
    </div>
  </div>

  <!-- PANEL -->
  <div class="panel">

    <!-- PLAYER 1 -->
    <div class="pcard p1 active" id="c1">
      <div class="pcard-head">
        <div class="pcard-icon">P1</div>

        <div class="pcard-info">
          <h3>PLAYER 1</h3>
          <div class="pcard-pos">
            Cell: <span id="ps1">START</span>
          </div>

          <div class="turn-badge" id="tb1">
            YOUR TURN
          </div>
        </div>
      </div>
    </div>

    <!-- PLAYER 2 -->
    <div class="pcard p2" id="c2">
      <div class="pcard-head">
        <div class="pcard-icon">P2</div>

        <div class="pcard-info">
          <h3>PLAYER 2</h3>
          <div class="pcard-pos">
            Cell: <span id="ps2">START</span>
          </div>

          <div class="turn-badge" id="tb2" style="display:none">
            YOUR TURN
          </div>
        </div>
      </div>
    </div>

    <!-- DICE -->
    <div class="dice-box">

      <div class="dice-label">
        Roll the Dice
      </div>

      <div class="dice" id="dice">
        <div class="pip pip-a" id="pa"></div>
        <div class="pip pip-b" id="pb"></div>
        <div class="pip pip-c" id="pc"></div>
        <div class="pip pip-d" id="pd"></div>
        <div class="pip pip-e" id="pe"></div>
        <div class="pip pip-f" id="pf"></div>
        <div class="pip pip-g" id="pg"></div>
      </div>

      <button class="roll-btn" id="rollBtn" onclick="roll()">
        ROLL DICE
      </button>
    </div>

    <!-- LOG -->
    <div class="log-box">
      <div class="log-title">Game Log</div>
      <div id="log"></div>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
